timezone: Asia/Shanghai

limits:
  max_unfinished_reservations: 3
  continue_monitoring_at_limit: true
  auto_cancel: false

scheduled_jobs:
  - name: 后天晚间羽毛球
    enabled: false
    date_offset: 2
    action_start: "06:50"
    login_at: "06:55"
    submit_at: "07:00"
    strategy: consecutive_first
    max_new_reservations: 2
    fallback_to_single_slot: true
    preferences:
      - venue: 北区体育馆
        sport: 羽毛球
        blocks:
          - ["19:00-20:00", "20:00-21:00"]
          - ["18:00-19:00", "19:00-20:00"]
      - venue: 正大体育馆
        sport: 羽毛球
        blocks:
          - ["19:00-20:00", "20:00-21:00"]

monitor:
  enabled: false
  interval_minutes: 5
  active_start: "07:00"
  active_end: "24:00"
  jobs:
    - name: 北区网球场
      venue: 本北高速室外网球场
      sport: 网球
      dates: next_3_days
      times: ["10:00-11:00", "9:00-10:00"]
      mode: auto_book_if_capacity
      max_new_reservations: 1

notification:
  provider: qq_smtp
  notify_on_available: true
  notify_on_booking_success: true
  notify_on_booking_failure: true
  notify_on_auth_expired: true
  notify_on_rate_limit: true

