timezone: Asia/Shanghai

limits:
  max_unfinished_reservations: 3
  continue_monitoring_at_limit: true
  auto_cancel: false

scheduled_jobs:
  - name: 后天北区体育馆乒乓球
    enabled: true
    date_offset: 2
    action_start: "11:48"
    login_at: "11:48"
    submit_at: "11:53"
    strategy: consecutive_first
    max_new_reservations: 2
    fallback_to_single_slot: true
    preferences:
      - venue: 北区体育馆
        sport: 乒乓球
        blocks:
          - ["09:00-10:00", "10:00-11:00"]
          - ["12:00-13:00"]

monitor:
  enabled: false
  interval_minutes: 5
  active_start: "07:00"
  active_end: "24:00"
  jobs:
    - name: 北区体育馆乒乓
      venue: 北区体育馆
      sport: 乒乓球
      dates: [0, 1, 2]
      times: ["10:00-11:00", "09:00-10:00", "12:00-13:00"]
      mode: auto_book_if_capacity
      max_new_reservations: 2

notification:
  provider: qq_smtp
  notify_on_available: true
  notify_on_booking_success: true
  notify_on_booking_failure: true
  notify_on_auth_expired: true
  notify_on_rate_limit: true
