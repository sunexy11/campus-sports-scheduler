timezone: Asia/Shanghai

limits:
  max_unfinished_reservations: 3
  continue_monitoring_at_limit: true
  auto_cancel: false

scheduled_jobs:
  - name: 后天正大优先羽毛球
    enabled: true
    date_offset: 2
    action_start: "06:50"
    login_at: "06:55"
    submit_at: "07:00"
    strategy: consecutive_first
    max_new_reservations: 2
    # 先尝试正大两个连续时段；正大没有完整连续块时再尝试北区。
    fallback_to_single_slot: true
    preferences:
      - venue: 正大体育馆
        sport: 羽毛球
        blocks:
          - ["19:00-20:00", "20:00-21:00"]
          - ["20:00-21:00", "21:00-22:00"]
      - venue: 北区体育馆
        sport: 羽毛球
        blocks:
          - ["19:00-20:00", "20:00-21:00"]

monitor:
  enabled: true
  interval_minutes: 5
  active_start: "07:00"
  active_end: "24:00"
  jobs:
    - name: 晚间正大体育馆羽毛球自动预约
      venue: 正大体育馆
      sport: 羽毛球
      dates: [1, 2]
      times: ["19:00-20:00", "20:00-21:00", "21:00-22:00"]
      mode: auto_book_if_capacity
      max_new_reservations: 2
    - name: 晚间本北高速室外网球场监控
      venue: 本北高速室外网球场
      sport: 网球
      dates: [1, 2]
      times: ["16:00-17:00"]
      mode: monitor_only
      # monitor_only 不会预约；这里保持为正数，避免 max_new=0 触发“跳过整个任务”。
      max_new_reservations: 1
    - name: 晚间国权路运动场网球监控
      venue: 国权路运动场
      sport: 网球
      dates: [1, 2]
      times: ["16:00-17:00"]
      mode: monitor_only
      max_new_reservations: 1

notification:
  provider: qq_smtp
  notify_on_available: true
  notify_on_booking_success: true
  notify_on_booking_failure: true
  notify_on_auth_expired: true
  notify_on_rate_limit: true
