timezone: Asia/Shanghai

limits:
  max_unfinished_reservations: 3
  continue_monitoring_at_limit: true
  auto_cancel: false

scheduled_jobs:
  - name: 测试-后天北区体育馆乒乓球
    enabled: true
    date_offset: 2
    action_start: "14:00"
    login_at: "14:00"
    submit_at: "14:05"
    strategy: consecutive_first
    max_new_reservations: 2
    fallback_to_single_slot: true
    preferences:
      - venue: 北区体育馆
        sport: 乒乓球
        blocks:
          - ["09:00-10:00"]
          - ["10:00-11:00"]
          - ["11:00-12:00"]
          - ["12:00-13:00"]

monitor:
  enabled: true
  interval_minutes: 5
  active_start: "07:00"
  active_end: "24:00"
  jobs:
    - name: 晚间北区体育馆羽毛球监控
      venue: 北区体育馆
      sport: 羽毛球
      dates: [1, 2]
      times: ["19:00-20:00", "20:00-21:00"]
      mode: auto_book_if_capacity
      max_new_reservations: 2
    - name: 晚间正大体育馆羽毛球监控
      venue: 正大体育馆
      sport: 羽毛球
      dates: [1, 2]
      times: ["19:00-20:00", "20:00-21:00", "21:00-22:00"]
      mode: auto_book_if_capacity
      max_new_reservations: 2

notification:
  provider: qq_smtp
  notify_on_available: true
  notify_on_booking_success: true
  notify_on_booking_failure: true
  notify_on_auth_expired: true
  notify_on_rate_limit: true
