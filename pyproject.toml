[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-sports-scheduler"
version = "0.1.0"
description = "Campus sports venue booking and vacancy monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "pycryptodome>=3.23,<4",
  "python-dotenv>=1.1,<2",
  "pyotp>=2.9,<3",
  "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
# Keep the historical command for local scripts and existing workflows.
fudan-booking = "fudan_booking.cli:main"
campus-sports = "fudan_booking.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
