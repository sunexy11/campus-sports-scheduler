main:
  api_trigger_book_at_open:
    - name: Book at opening time
      runner:
        tags: cnb:arch:amd64
        cpus: 1
      docker:
        image: node:24-bookworm
      imports:
        - https://cnb.cool/sunexy11/campus-sports-scheduler-secrets/-/blob/main/booking.yml
      stages:
        - name: Prepare Python and Node dependencies
          script: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv
            rm -rf /var/lib/apt/lists/*
            npm install --global pnpm@11.25.0
            node --version
            pnpm --dir challenge install --frozen-lockfile
            python3 -m venv .venv
            .venv/bin/pip install --disable-pip-version-check -e .
            .venv/bin/fudan-booking validate-config --config config/config.example.yaml
        - name: Run dry-run or scheduled booking
          script: |
            set -eu
            if [ -z "${FUDAN_USERNAME:-}" ] || [ -z "${FUDAN_PASSWORD:-}" ]; then
              echo "FUDAN_USERNAME and FUDAN_PASSWORD are required." >&2
              exit 2
            fi

            allow_booking="${allow_booking:-false}"
            wait_until="${wait_until:-07:00}"
            retry_window_seconds="${retry_window_seconds:-180}"

            case "$allow_booking" in
              true|false) ;;
              *) echo "allow_booking must be 'true' or 'false'." >&2; exit 2 ;;
            esac
            case "$retry_window_seconds" in
              ''|*[!0-9]*) echo "retry_window_seconds must be a positive integer." >&2; exit 2 ;;
            esac
            if [ "$retry_window_seconds" -lt 1 ]; then
              echo "retry_window_seconds must be a positive integer." >&2
              exit 2
            fi
            if ! python3 -c 'import re, sys; sys.exit(0 if re.fullmatch(r"(?:[01][0-9]|2[0-3]):[0-5][0-9]", sys.argv[1]) else 1)' "$wait_until"; then
              echo "wait_until must use 24-hour HH:MM format." >&2
              exit 2
            fi

            if [ "$allow_booking" = "true" ]; then
              .venv/bin/fudan-booking scheduled-book-once \
                --config config/config.example.yaml \
                --wait-until "$wait_until" \
                --retry-window-seconds "$retry_window_seconds" \
                --allow-booking
            else
              echo "allow_booking is not true; running read-only dry-run."
              .venv/bin/fudan-booking scheduled-book-once \
                --config config/config.example.yaml \
                --no-email
            fi
