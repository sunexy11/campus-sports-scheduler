name: Book at opening time

on:
  workflow_dispatch:
    inputs:
      allow_booking:
        description: Allow live reservation submission
        required: true
        default: false
        type: boolean
      wait_until:
        description: Temporary test value; wait until this Asia/Shanghai time before submitting
        required: true
        default: "07:00"
        type: string

permissions:
  contents: read

concurrency:
  group: book-at-open
  cancel-in-progress: false

jobs:
  scheduled-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUDAN_USERNAME: ${{ secrets.FUDAN_USERNAME }}
      FUDAN_PASSWORD: ${{ secrets.FUDAN_PASSWORD }}
      FUDAN_TOTP_SECRET: ${{ secrets.FUDAN_TOTP_SECRET }}
      FUDAN_NODE_BIN: node
      QQ_SMTP_USERNAME: ${{ secrets.QQ_SMTP_USERNAME }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: challenge
      - run: python -m pip install -e .
      - run: fudan-booking validate-config --config config/config.example.yaml
      - name: Run scheduled strategy
        run: |
          if [[ -z "$FUDAN_USERNAME" || -z "$FUDAN_PASSWORD" ]]; then
            echo "FUDAN_USERNAME and FUDAN_PASSWORD are required." >&2
            exit 2
          fi
          args=(scheduled-book-once --config config/config.example.yaml)
          if [[ -n "${{ inputs.wait_until }}" ]]; then
            args+=(--wait-until "${{ inputs.wait_until }}")
          fi
          if [[ "${{ inputs.allow_booking }}" == "true" ]]; then
            args+=(--allow-booking)
          fi
          fudan-booking "${args[@]}"
