name: Book at opening time

# Planned schedule: 03:48 UTC = 11:48 Asia/Shanghai. The workflow logs in as
# soon as the environment is ready, then waits until 11:53 before submitting.
on:
  schedule:
    # 03:48 UTC = 11:48 Asia/Shanghai.
    - cron: "48 3 * * *"
  workflow_dispatch:
    inputs:
      allow_booking:
        description: Allow live reservation submission
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: book-at-open
  cancel-in-progress: false

jobs:
  scheduled-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUDAN_USERNAME: ${{ secrets.FUDAN_USERNAME }}
      FUDAN_PASSWORD: ${{ secrets.FUDAN_PASSWORD }}
      FUDAN_TOTP_SECRET: ${{ secrets.FUDAN_TOTP_SECRET }}
      FUDAN_NODE_BIN: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: challenge
      - run: python -m pip install -e .
      - run: fudan-booking validate-config --config config/config.example.yaml
      - name: Run scheduled strategy
        run: |
          if [[ -z "$FUDAN_USERNAME" || -z "$FUDAN_PASSWORD" ]]; then
            echo "FUDAN_USERNAME and FUDAN_PASSWORD are required." >&2
            exit 2
          fi
          args=(scheduled-book-once --config config/config.example.yaml)
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # The 11:48 runner logs in after setup and waits until 11:53.
            args+=(--wait-until 11:53)
          fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.allow_booking }}" == "true" ]]; then
            args+=(--allow-booking)
          fi
          fudan-booking "${args[@]}"
