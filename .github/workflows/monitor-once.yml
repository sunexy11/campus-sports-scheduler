name: Monitor booking slots once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-once
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FUDAN_USERNAME: ${{ secrets.FUDAN_USERNAME }}
      FUDAN_PASSWORD: ${{ secrets.FUDAN_PASSWORD }}
      FUDAN_TOTP_SECRET: ${{ secrets.FUDAN_TOTP_SECRET }}
      FUDAN_NODE_BIN: node
      QQ_SMTP_USERNAME: ${{ secrets.QQ_SMTP_USERNAME }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: challenge
      - run: python -m pip install -e .
      - name: Check configured slots and notify
        run: |
          if [[ -z "$FUDAN_USERNAME" || -z "$FUDAN_PASSWORD" ]]; then
            echo "FUDAN_USERNAME and FUDAN_PASSWORD are required." >&2
            exit 2
          fi
          fudan-booking monitor-once --config config/config.example.yaml
